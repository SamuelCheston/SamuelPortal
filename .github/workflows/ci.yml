# Minimal CI: install dependencies, build the Astro site, and run the two
# self-checks (page hygiene on the build output; public reachability of every
# portfolio URL — tolerant of rate limits/timeouts, fails only on 404).
name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Check built pages
      run: node scripts/check-pages.mjs

    - name: Check project URLs
      run: bash scripts/check-project-urls.sh
